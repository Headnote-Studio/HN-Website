<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Headnote Studio — Open Graph card source (1200×630).
    Rebuild: rasterise with resvg (or any SVG renderer) with these fonts available:
      Fraunces SemiBold (wght 600, opsz 144), Fraunces Medium Italic (wght 500), Inter SemiBold (wght 600)
    Symbol is composed from images/headnote-symbol-light.svg (not redrawn).
    Palette: Deep Ink #10201C · Muted Brass #B89B5E · Parchment #F6F1E8
  -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10201C"/>
      <stop offset="1" stop-color="#0d1a16"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#B89B5E"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ink)"/>

  <!-- brass dot-grid accents, faded -->
  <rect x="64" y="64" width="150" height="94" fill="url(#dots)" opacity="0.28"/>
  <rect x="990" y="478" width="150" height="94" fill="url(#dots)" opacity="0.28"/>

  <!-- H symbol: geometry from images/headnote-symbol-light.svg, translated + scaled -->
  <g transform="translate(536,114) scale(2)">
    <rect x="13" y="8" width="10" height="48" rx="1" fill="#F6F1E8"/>
    <rect x="41" y="8" width="10" height="48" rx="1" fill="#F6F1E8"/>
    <rect x="13" y="15" width="17" height="7" rx="1" fill="#B89B5E"/>
    <rect x="34" y="15" width="17" height="7" rx="1" fill="#B89B5E"/>
  </g>

  <text x="600" y="352" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="96" fill="#F6F1E8">Headnote</text>

  <text x="594" y="404" text-anchor="middle" font-family="Inter" font-weight="600" font-size="26" letter-spacing="12" fill="#B89B5E">STUDIO</text>

  <line x1="560" y1="448" x2="640" y2="448" stroke="#B89B5E" stroke-width="1.5" opacity="0.9"/>

  <text x="600" y="508" text-anchor="middle" font-family="Fraunces" font-weight="500" font-style="italic" font-size="34" fill="#F6F1E8" opacity="0.72">The first note your next client sees.</text>
</svg>
